name: release

# Build and publish a GitHub Release whenever a v* tag is pushed.
# (e.g. git tag -a v0.1.1 -m "svault v0.1.1" && git push origin v0.1.1)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # Cache built vcpkg packages across runs so releases do not rebuild
      # SQLCipher/OpenSSL from scratch every time.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Cache vcpkg (downloads + binary cache)
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('build.sh') }}

      - name: Prepare vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg-cache" | Out-Null

      - name: Build
        shell: msys2 {0}
        run: |
          export VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          go version
          mingw32-make BASH=bash

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path dist/* -DestinationPath "svault-$v-windows-x64.zip"
          $h = (Get-FileHash "svault-$v-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  svault-$v-windows-x64.zip" | Set-Content "svault-$v-windows-x64.zip.sha256"
          Get-ChildItem "svault-$v-windows-x64.zip*" | Select-Object Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}"
          $extra = @()
          if ($v -match '-') { $extra += '--prerelease' }
          gh release create $v `
            "svault-$v-windows-x64.zip" `
            "svault-$v-windows-x64.zip.sha256" `
            --title "svault $v" --generate-notes @extra
